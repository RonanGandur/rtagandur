<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSmaart - Analisador Acústico</title>

<style>

/* Variáveis de Tema */
:root.dark {
    --bg-base: #0D1117; --bg-panel: #161b22; --border-color: #30363d;
    --text-main: #c9d1d9; --text-muted: #8b949e;
    --accent-blue: #00B7FF; --accent-green: #00FF88; --canvas-bg: #000000;
}
:root.light {
    --bg-base: #f0f2f5; --bg-panel: #ffffff; --border-color: #d0d7de;
    --text-main: #24292f; --text-muted: #57606a;
    --accent-blue: #0969da; --accent-green: #2da44e; --canvas-bg: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: var(--bg-base); color: var(--text-main);
    font-family: sans-serif; height: 100vh; display: flex;
    flex-direction: column; overflow: hidden; user-select: none;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

/* Topbar */
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color); }
.tab-buttons { display: flex; gap: 4px; }
.tab-btn { padding: 6px 16px; background: transparent; color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; font-size: 14px; }
.tab-btn:hover { background-color: var(--border-color); }
.tab-btn.active { background-color: var(--text-muted); color: #fff; font-weight: bold; border-color: var(--text-muted); }
.controls { display: flex; align-items: center; gap: 16px; }
.theme-btn { font-size: 12px; padding: 4px 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); border-radius: 4px; cursor: pointer; }
.theme-btn:hover { color: var(--accent-blue); }
.clock { color: var(--accent-green); font-family: monospace; font-size: 20px; font-weight: bold; }

/* Layout Principal */
.main-container { display: flex; flex: 1; overflow: hidden; }

/* Left Panel (Data Bar) */
.data-bar { width: 200px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 8px; gap: 8px; }
.data-bar-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px; border-bottom: 1px solid var(--border-color); }
.data-bar-header span { font-size: 12px; font-weight: bold; color: var(--accent-blue); }
#btn-capture { background-color: var(--text-muted); color: #fff; border: none; padding: 4px 8px; font-size: 10px; text-transform: uppercase; font-weight: bold; border-radius: 4px; cursor: pointer; }
#btn-capture:hover { filter: brightness(1.2); }
.trace-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.trace-item { display: flex; align-items: center; gap: 8px; background-color: var(--bg-base); padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; }
.trace-color { width: 16px; height: 16px; border: 1px solid var(--border-color); border-radius: 2px; cursor: pointer; flex-shrink: 0; }
.trace-name { background: transparent; border: none; color: var(--text-main); width: 100%; outline: none; font-size: 12px; }
.trace-name:focus { border-bottom: 1px solid var(--border-color); }
.trace-del { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; font-weight: bold; }
.trace-del:hover { color: #ff4444; }

/* Center Views */
.views-container { flex: 1; background-color: var(--bg-base); padding: 8px; display: flex; flex-direction: column; min-width: 0; }
.view { display: none; flex: 1; flex-direction: column; gap: 8px; }
.view.active-view { display: flex; }
.chart-container { position: relative; border: 1px solid var(--border-color); background-color: var(--canvas-bg); border-radius: 4px; display: flex; flex-direction: column; }
.chart-label { position: absolute; top: 4px; left: 8px; font-size: 10px; color: var(--text-muted); z-index: 10; }
canvas { flex: 1; width: 100%; height: 100%; display: block; }
.tf-layout .impulse-chart { flex: 0 0 20%; max-height: 100px; }
.tf-layout .phase-chart { flex: 0 0 40%; max-height: 250px; }
.tf-layout .mag-chart { flex: 0 0 40%; max-height: 250px; }
.full-height-chart { flex: 1; }
.spectro-layout .spectro-chart { flex: 1; }

.spl-panel { height: 100px; background-color: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 4px; display: flex; justify-content: space-around; align-items: center; }
.spl-display { text-align: center; }
.spl-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.spl-value { font-size: 36px; font-weight: bold; }
.spl-current-val { color: var(--accent-green); }
.spl-max-val { color: var(--accent-blue); }

/* Right Panel (Settings) */
.settings-panel { width: 280px; background-color: var(--bg-panel); border-left: 1px solid var(--border-color); padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.settings-group { border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; }
.settings-group h3 { font-size: 13px; color: var(--accent-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-bottom: 8px; text-transform: uppercase; }
.settings-group label { display: block; font-size: 11px; color: var(--text-muted); margin: 8px 0 4px 0; }
.settings-group select, .settings-group input { width: 100%; background-color: var(--bg-base); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px; border-radius: 4px; outline: none; font-size: 12px; }

/* Audio Access Btn */
.access-btn { width: 100%; padding: 6px; background-color: var(--accent-blue); color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; margin-bottom: 8px; transition: 0.2s;}
.access-btn:hover { filter: brightness(1.2); }
.access-btn.granted { background-color: var(--accent-green); }

/* VU Meters */
.vu-meters-container { display: flex; justify-content: space-around; margin-top: 12px; height: 100px; padding: 4px; background: #000; border-radius: 4px; border: 1px solid var(--border-color); }
.vu-channel { display: flex; flex-direction: column; align-items: center; width: 20px; }
.vu-bg { flex: 1; width: 12px; background-color: #111; border: 1px solid #333; border-radius: 2px; position: relative; overflow: hidden; }
.vu-fill { position: absolute; bottom: 0; width: 100%; height: 0%; /* Default anim via JS */ background: linear-gradient(to top, #00FF88 50%, #FFD700 80%, #FF0000 100%); transition: height 0.05s ease-out; }
.vu-channel span { font-size: 9px; color: var(--text-muted); margin-top: 4px; font-weight: bold; }

/* Signal Generator */
.generator-controls { display: flex; gap: 8px; align-items: flex-end; }
.noise-btn { flex: 1; padding: 8px; background-color: #1f6feb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
.noise-btn.playing { background-color: #da3633; }
.gain-input { width: 60px; }
.gain-input input { text-align: center; }

.scale-inputs { display: flex; gap: 8px; }
.cal-btn { width: 100%; background-color: rgba(139, 0, 0, 0.5); color: #ffcccc; border: 1px solid #8b0000; padding: 6px; border-radius: 4px; cursor: pointer; margin-bottom: 8px; }
.cal-btn:hover { background-color: rgba(139, 0, 0, 0.8); }
.json-buttons { display: flex; gap: 8px; }
.json-buttons button { flex: 1; background-color: var(--bg-base); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.json-buttons button:hover { background-color: var(--border-color); }
.autosave-notice { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: auto; }

</style>
    
</head>
<body>
    <!-- Topbar -->
    <header class="topbar">
        <div class="tab-buttons">
            <button id="btn-tf" class="tab-btn active">Transfer Function</button>
            <button id="btn-rta" class="tab-btn">RTA</button>
            <button id="btn-spectro" class="tab-btn">Spectrograph & SPL</button>
        </div>
        <div class="controls">
            <button id="btn-theme" class="theme-btn">Toggle Light/Dark</button>
            <div id="clock-display" class="clock">00:00:00</div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        
        <!-- Left Panel: Data Bar (Traces) -->
        <aside class="data-bar">
            <div class="data-bar-header">
                <span>Data Bar</span>
                <button id="btn-capture">Capture</button>
            </div>
            <div id="trace-list" class="trace-list"></div>
        </aside>

        <!-- Center: Measurement Views -->
        <main class="views-container">
            <!-- VIEW: Transfer Function -->
            <div id="view-tf" class="view active-view tf-layout">
                <div class="chart-container impulse-chart">
                    <span class="chart-label">IMPULSE RESPONSE</span>
                    <canvas id="canvas-impulse"></canvas>
                </div>
                <div class="chart-container phase-chart">
                    <span class="chart-label">PHASE</span>
                    <canvas id="canvas-phase"></canvas>
                </div>
                <div class="chart-container mag-chart">
                    <span class="chart-label">MAGNITUDE & COHERENCE</span>
                    <canvas id="canvas-mag"></canvas>
                </div>
            </div>

            <!-- VIEW: RTA -->
            <div id="view-rta" class="view">
                <div class="chart-container full-height-chart">
                    <span class="chart-label">RTA (20 Hz - 20 kHz)</span>
                    <canvas id="canvas-rta"></canvas>
                </div>
            </div>

            <!-- VIEW: Spectrograph & SPL -->
            <div id="view-spectro" class="view spectro-layout">
                <div class="chart-container spectro-chart">
                    <span class="chart-label">SPECTROGRAPH</span>
                    <canvas id="canvas-spectro"></canvas>
                </div>
                <div class="spl-panel">
                    <div class="spl-display">
                        <div class="spl-label">SPL (Auto)</div>
                        <div id="spl-current" class="spl-value spl-current-val">-- dB</div>
                    </div>
                    <div class="spl-display">
                        <div class="spl-label">MAX SPL</div>
                        <div id="spl-max" class="spl-value spl-max-val">-- dB</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Panel: Settings -->
        <aside class="settings-panel">
            
            <!-- NEW: Audio Engine & VU Meters -->
            <div class="settings-group">
                <h3>Audio Engine & I/O</h3>
                <button id="btn-audio-access" class="access-btn">1. Request Audio Access</button>
                
                <label>Input Device (Mic/Ref)</label>
                <select id="input-device" disabled><option>Aguardando permissão...</option></select>
                
                <label>Output Device (Speaker)</label>
                <select id="output-device" disabled><option>Aguardando permissão...</option></select>

                <!-- VU Meters Container -->
                <div class="vu-meters-container">
                    <div class="vu-channel">
                        <div class="vu-bg"><div class="vu-fill" id="vu-in-l"></div></div>
                        <span>IN L</span>
                    </div>
                    <div class="vu-channel">
                        <div class="vu-bg"><div class="vu-fill" id="vu-in-r"></div></div>
                        <span>IN R</span>
                    </div>
                    <div class="vu-channel" style="margin-left: 10px;">
                        <div class="vu-bg"><div class="vu-fill" id="vu-out-l"></div></div>
                        <span>OUT L</span>
                    </div>
                    <div class="vu-channel">
                        <div class="vu-bg"><div class="vu-fill" id="vu-out-r"></div></div>
                        <span>OUT R</span>
                    </div>
                </div>
            </div>

            <!-- NEW: Signal Generator -->
            <div class="settings-group">
                <h3>Signal Generator</h3>
                <div class="generator-controls">
                    <button id="btn-noise" class="noise-btn play">▶ Pink Noise</button>
                    <div class="gain-input">
                        <label>Level (dB)</label>
                        <input type="number" id="noise-gain" value="-18" max="0" min="-60" step="1">
                    </div>
                </div>
            </div>

            <!-- Measurement -->
            <div class="settings-group">
                <h3>Measurement</h3>
                <label>Smoothing</label>
                <select id="config-smoothing">
                    <option value="0">None</option>
                    <option value="3">1/3 Octave</option>
                    <option value="6" selected>1/6 Octave</option>
                </select>
                <label>Averaging</label>
                <select id="config-avg">
                    <option value="fast">Fast</option>
                    <option value="1s">1 Second</option>
                    <option value="2s" selected>2 Seconds</option>
                    <option value="slow">Slow</option>
                </select>
                <label>Graph Scale (Hz)</label>
                <div class="scale-inputs">
                    <input type="number" id="scale-min" value="20" title="Min Hz">
                    <input type="number" id="scale-max" value="20000" title="Max Hz">
                </div>
            </div>

            <!-- Calibration & File -->
            <div class="settings-group">
                <button id="btn-calibrate" class="cal-btn">Set SPL Calibration</button>
                <div class="json-buttons">
                    <button id="btn-export">Export JSON</button>
                    <button id="btn-import">Import JSON</button>
                </div>
            </div>
            
            <div class="autosave-notice">Autosave Enabled (Local)</div>
        </aside>
    </div>

    <script>
    
// =========================================================================
// WEBSMAART - MOTOR DE ÁUDIO REAL (WEB AUDIO API)
// =========================================================================

let appState = {
    theme: 'dark', smoothing: '6', averaging: '2s',
    scaleMin: 20, scaleMax: 20000, noiseGain: -18
};

let savedTraces = [];
const traceColors = ['#00FF88', '#00B7FF', '#FF00FF', '#FFD700', '#00FFFF', '#FF8C00'];

// --- VARIÁVEIS DE ÁUDIO ---
let audioCtx;
let inputStream, outputStream;
let sourceNode;
let splitter;
let analyzerInL, analyzerInR; // Analisadores de VU In
let analyzerOutL, analyzerOutR; // Analisadores de VU Out

// Nodes do Gerador de Ruído
let noiseNode;
let noiseGainNode;
let isNoisePlaying = false;

// Loop de desenho dos VUs
let animationFrameId;

document.addEventListener('DOMContentLoaded', () => {
    initUI();
    loadState();
    startClock();
    
    document.getElementById('btn-capture').addEventListener('click', captureTrace);
    document.getElementById('btn-audio-access').addEventListener('click', requestAudioAccess);
    document.getElementById('btn-noise').addEventListener('click', togglePinkNoise);
    
    // Atualiza o ganho quando o input muda
    document.getElementById('noise-gain').addEventListener('input', (e) => {
        if(noiseGainNode) {
            // Converte dB para ganho linear (0.0 a 1.0)
            const db = parseFloat(e.target.value);
            const linearGain = Math.pow(10, db / 20);
            noiseGainNode.gain.value = linearGain;
        }
    });
});

function initUI() {
    const views = {
        'btn-tf': document.getElementById('view-tf'),
        'btn-rta': document.getElementById('view-rta'),
        'btn-spectro': document.getElementById('view-spectro')
    };
    const buttons = Object.keys(views).map(id => document.getElementById(id));

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('active'));
            Object.values(views).forEach(v => v.classList.remove('active-view'));
            btn.classList.add('active');
            views[btn.id].classList.add('active-view');
        });
    });

    document.getElementById('btn-theme').addEventListener('click', toggleTheme);

    const inputs = ['config-smoothing', 'config-avg', 'scale-min', 'scale-max', 'noise-gain'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
            let key = id.replace('config-', '').replace('-', '');
            if(id === 'scale-min') key = 'scaleMin';
            if(id === 'scale-max') key = 'scaleMax';
            if(id === 'noise-gain') key = 'noiseGain';
            appState[key] = e.target.value;
            saveState();
        });
    });

    document.getElementById('btn-export').addEventListener('click', exportJSON);
    document.getElementById('btn-import').addEventListener('click', importJSON);
}

// ==========================================
// AUDIO ENGINE (WEB AUDIO API REAL)
// ==========================================

async function requestAudioAccess() {
    const btn = document.getElementById('btn-audio-access');
    
    try {
        // Pede permissão para acessar o hardware real (Desliga filtros)
        inputStream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
                echoCancellation: false, 
                autoGainControl: false, 
                noiseSuppression: false 
            } 
        });
        
        btn.textContent = "Audio Access Granted";
        btn.classList.add('granted');
        
        // Inicia o Contexto de Áudio (Coração da Etapa 3)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        await populateDeviceLists();
        setupAudioRouting();
        
    } catch (err) {
        alert("Erro ao acessar placa de áudio. Rode em localhost ou https:// e não use iframes.");
        console.error(err);
    }
}

async function populateDeviceLists() {
    const inputSelect = document.getElementById('input-device');
    const outputSelect = document.getElementById('output-device');
    
    inputSelect.innerHTML = '';
    outputSelect.innerHTML = '';
    inputSelect.disabled = false;
    outputSelect.disabled = false;

    const devices = await navigator.mediaDevices.enumerateDevices();
    
    devices.forEach(device => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        
        if (device.kind === 'audioinput') {
            option.text = device.label || `Microphone ${inputSelect.length + 1}`;
            inputSelect.appendChild(option);
        } else if (device.kind === 'audiooutput') {
            option.text = device.label || `Speaker ${outputSelect.length + 1}`;
            outputSelect.appendChild(option);
        }
    });

    if(inputSelect.options.length === 0) inputSelect.innerHTML = '<option>Nenhum input encontrado</option>';
    if(outputSelect.options.length === 0) outputSelect.innerHTML = '<option>Nenhum output encontrado</option>';
}

function setupAudioRouting() {
    // 1. Pega o som que vem do microfone/placa
    sourceNode = audioCtx.createMediaStreamSource(inputStream);
    
    // 2. Separa os canais L e R físicos
    splitter = audioCtx.createChannelSplitter(2);
    sourceNode.connect(splitter);
    
    // 3. Cria analisadores (para os VUs lerem os dados reais)
    analyzerInL = audioCtx.createAnalyser(); // Ref L
    analyzerInR = audioCtx.createAnalyser(); // Mic R
    analyzerOutL = audioCtx.createAnalyser(); // Pink Noise Out L
    analyzerOutR = audioCtx.createAnalyser(); // Pink Noise Out R
    
    // Configuração dos analisadores
    const fftSize = 1024;
    analyzerInL.fftSize = fftSize;
    analyzerInR.fftSize = fftSize;
    analyzerOutL.fftSize = fftSize;
    analyzerOutR.fftSize = fftSize;

    // 4. Conecta as vias divididas aos analisadores de Entrada
    splitter.connect(analyzerInL, 0); // Canal L (Reference)
    splitter.connect(analyzerInR, 1); // Canal R (Measurement)

    // O gerador de ruído se conectará aos analisadores de Saída quando for ligado
    
    // Inicia o Loop Visual real
    drawVUMetersReal();
}

// --- GERADOR DE PINK NOISE REAL ---
function createPinkNoiseNode() {
    const bufferSize = 4096;
    let b0, b1, b2, b3, b4, b5, b6;
    b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
    
    // Cria um nó script que processa áudio em tempo real
    const node = audioCtx.createScriptProcessor(bufferSize, 1, 2); // 1 entrada nula, 2 saídas
    
    node.onaudioprocess = function(e) {
        const outputL = e.outputBuffer.getChannelData(0);
        const outputR = e.outputBuffer.getChannelData(1);
        
        for (let i = 0; i < bufferSize; i++) {
            let white = Math.random() * 2 - 1;
            // Filtro de aproximação de Ruído Rosa (Paul Kellet's method)
            b0 = 0.99886 * b0 + white * 0.0555179;
            b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520;
            b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522;
            b5 = -0.7616 * b5 - white * 0.0168980;
            const pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
            const pinkScaled = pink * 0.11; // Escalado para não clipar
            
            b6 = white * 0.115926;
            
            outputL[i] = pinkScaled;
            outputR[i] = pinkScaled;
        }
    };
    return node;
}

function togglePinkNoise() {
    const btn = document.getElementById('btn-noise');
    
    if(!audioCtx) {
        alert("Por favor, peça acesso ao áudio (Request Audio Access) primeiro.");
        return;
    }

    isNoisePlaying = !isNoisePlaying;
    
    if(isNoisePlaying) {
        // PLAY
        noiseNode = createPinkNoiseNode();
        noiseGainNode = audioCtx.createGain();
        
        // Define o volume baseado no slider
        const db = parseFloat(document.getElementById('noise-gain').value);
        noiseGainNode.gain.value = Math.pow(10, db / 20);

        // Roteamento: Pink Noise -> Gain -> (Analyser Out L & R) -> Hardware Out
        noiseNode.connect(noiseGainNode);
        noiseGainNode.connect(analyzerOutL);
        noiseGainNode.connect(analyzerOutR);
        noiseGainNode.connect(audioCtx.destination);
        
        btn.textContent = "⏹ Stop Noise";
        btn.classList.add('playing');
    } else {
        // STOP
        if(noiseNode) {
            noiseNode.disconnect();
            noiseGainNode.disconnect();
        }
        btn.textContent = "▶ Pink Noise";
        btn.classList.remove('playing');
    }
}

// --- MEDIÇÃO DE SINAL (VU METERS REAIS) ---
function getRMSdB(analyzer) {
    if(!analyzer) return -100;
    const dataArray = new Float32Array(analyzer.fftSize);
    analyzer.getFloatTimeDomainData(dataArray);
    
    let sumSquares = 0.0;
    for (let i = 0; i < dataArray.length; i++) {
        sumSquares += dataArray[i] * dataArray[i];
    }
    const rms = Math.sqrt(sumSquares / dataArray.length);
    
    // Converte para dBFS (Decibels Full Scale)
    let db = 20 * Math.log10(rms);
    if (db < -60) db = -60; // Piso de ruído visual
    return db;
}

function drawVUMetersReal() {
    const vuInL = document.getElementById('vu-in-l');
    const vuInR = document.getElementById('vu-in-r');
    const vuOutL = document.getElementById('vu-out-l');
    const vuOutR = document.getElementById('vu-out-r');

    function draw() {
        animationFrameId = requestAnimationFrame(draw);
        
        // Lê dB reais das 4 vias
        const dbInL = getRMSdB(analyzerInL);
        const dbInR = getRMSdB(analyzerInR);
        const dbOutL = getRMSdB(analyzerOutL);
        const dbOutR = getRMSdB(analyzerOutR);

        // Mapeia de -60dB (0%) até 0dB (100%)
        const mapDBtoHeight = (db) => Math.max(0, ((db + 60) / 60) * 100);

        vuInL.style.height = `${mapDBtoHeight(dbInL)}%`;
        vuInR.style.height = `${mapDBtoHeight(dbInR)}%`;
        vuOutL.style.height = `${mapDBtoHeight(dbOutL)}%`;
        vuOutR.style.height = `${mapDBtoHeight(dbOutR)}%`;
    }
    
    draw();
}

// ==========================================
// UTILIDADES
// ==========================================

function startClock() {
    const clockEl = document.getElementById('clock-display');
    setInterval(() => { clockEl.textContent = new Date().toLocaleTimeString('pt-BR', { hour12: false }); }, 1000);
}

function toggleTheme() {
    const root = document.documentElement;
    if (root.classList.contains('dark')) {
        root.classList.remove('dark'); root.classList.add('light'); appState.theme = 'light';
    } else {
        root.classList.remove('light'); root.classList.add('dark'); appState.theme = 'dark';
    }
    saveState();
}

function saveState() { localStorage.setItem('WebSmaart_State', JSON.stringify(appState)); }

function loadState() {
    const saved = localStorage.getItem('WebSmaart_State');
    if (saved) {
        appState = { ...appState, ...JSON.parse(saved) };
        const root = document.documentElement;
        if (appState.theme === 'dark') { root.classList.remove('light'); root.classList.add('dark'); } 
        else { root.classList.remove('dark'); root.classList.add('light'); }
        
        document.getElementById('config-smoothing').value = appState.smoothing;
        document.getElementById('config-avg').value = appState.averaging;
        document.getElementById('scale-min').value = appState.scaleMin;
        document.getElementById('scale-max').value = appState.scaleMax;
        document.getElementById('noise-gain').value = appState.noiseGain;
    }
}

function exportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
    const dl = document.createElement('a');
    dl.href = dataStr; dl.download = "websmaart_config.json"; dl.click();
}

function importJSON() {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
        const reader = new FileReader();
        reader.readAsText(e.target.files[0], 'UTF-8');
        reader.onload = re => {
            try { appState = { ...appState, ...JSON.parse(re.target.result) }; saveState(); loadState(); } 
            catch (err) { alert('Erro no JSON.'); }
        }
    };
    input.click();
}

function captureTrace() {
    const trace = { id: Date.now(), name: `Trace ${savedTraces.length + 1}`, color: traceColors[savedTraces.length % traceColors.length], visible: true };
    savedTraces.push(trace);
    renderTraces();
}

function renderTraces() {
    const list = document.getElementById('trace-list');
    list.innerHTML = '';
    [...savedTraces].reverse().forEach(trace => {
        const item = document.createElement('div');
        item.className = 'trace-item';
        
        const colorBox = document.createElement('div');
        colorBox.className = 'trace-color';
        colorBox.style.backgroundColor = trace.visible ? trace.color : 'transparent';
        colorBox.onclick = () => { trace.visible = !trace.visible; renderTraces(); };

        const nameInput = document.createElement('input');
        nameInput.className = 'trace-name'; nameInput.value = trace.name;
        nameInput.onchange = e => trace.name = e.target.value;

        const btnDel = document.createElement('button');
        btnDel.className = 'trace-del'; btnDel.innerHTML = '×';
        btnDel.onclick = () => { savedTraces = savedTraces.filter(t => t.id !== trace.id); renderTraces(); };

        item.append(colorBox, nameInput, btnDel);
        list.appendChild(item);
    });
}
    
    </script>
